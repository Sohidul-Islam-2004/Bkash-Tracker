<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bKash Tracker</title>
  </head>
  <body>
    <header>
      <div style="display: flex; align-items: center; gap: 12px">
        <img id="brandLogo" alt="Logo" title="Click to change logo" />
        <div>
          <h1>bKash Tracker</h1>
          <div class="sub">Daily &amp; monthly limit tracker</div>
        </div>
      </div>
      <div class="toolbar">
        <button class="btn btn-ghost btn-sm" onclick="exportCSV()">
          Export CSV
        </button>
      </div>
    </header>

    <div class="container">
      <!-- DASHBOARD -->
      <section id="viewDashboard">
        <div class="toolbar" style="margin-bottom: 16px">
          <button class="btn btn-primary" onclick="showAddPerson()">
            + Add Person
          </button>
        </div>
        <div id="peopleGrid" class="grid cards"></div>
      </section>

      <!-- ADD PERSON -->
      <section id="viewAddPerson" class="hidden">
        <button class="back" onclick="showDashboard()">← Back</button>
        <div class="panel" style="max-width: 560px">
          <h2>Add Person</h2>
          <form onsubmit="submitPerson(event)">
            <div class="field">
              <label>Photo (optional)</label>
              <div class="photo-row">
                <div id="photoFallback" class="avatar avatar-lg">?</div>
                <img id="photoPreview" class="avatar avatar-lg hidden" alt="" />
                <input
                  name="photo"
                  type="file"
                  accept="image/*"
                  onchange="previewPhoto(event)"
                />
              </div>
            </div>
            <div class="field">
              <label>Name</label>
              <input name="name" required placeholder="e.g. Karim" />
            </div>
            <div class="field">
              <label>bKash Number</label>
              <input
                name="bKashNumber"
                required
                pattern="01[0-9]{9}"
                placeholder="01XXXXXXXXX"
                maxlength="11"
              />
            </div>
            <div class="field">
              <label>Current Balance (৳)</label>
              <input
                name="initialBalance"
                type="number"
                step="0.01"
                value="0"
              />
            </div>

            <h2
              style="font-size: 14px; margin: 18px 0 10px; color: var(--muted)"
            >
              Already Used (৳)
            </h2>
            <div class="row">
              <div class="field">
                <label>Used Today</label>
                <input name="dailyUsedBase" type="number" min="0" value="0" />
              </div>
              <div class="field">
                <label>Used This Month</label>
                <input name="monthlyUsedBase" type="number" min="0" value="0" />
              </div>
            </div>
            <div class="info">
              Enter how much has already been sent today and this month.
              Remaining = ৳50,000 − Used Today and ৳300,000 − Used This Month.
              Values reset automatically (next day / next month).
            </div>

            <button
              class="btn btn-primary"
              type="submit"
              style="width: 100%; margin-top: 8px"
            >
              Save Person
            </button>
          </form>
        </div>
      </section>

      <!-- PERSON DETAIL -->
      <section id="viewPerson" class="hidden">
        <button class="back" onclick="showDashboard()">
          ← Back to Dashboard
        </button>
        <div id="personDetail"></div>
      </section>
    </div>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
  </body>
</html>
