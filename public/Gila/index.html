<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#d12053" />
    <title>ব্যক্তি হিসাব</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ============ TOPBAR ============ -->
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <button class="back-btn" id="backBtn" aria-label="ফিরে যান">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>

        <div class="brand">
          <div class="brand-logo" aria-hidden="true">
            <svg class="brand-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="el-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#e8437a" />
                  <stop offset="55%" stop-color="#d12053" />
                  <stop offset="100%" stop-color="#9c1038" />
                </linearGradient>
              </defs>
              <rect width="100" height="100" rx="24" fill="url(#el-grad)" />
              <path d="M0 24 Q0 0 24 0 L76 0 Q100 0 100 24 L100 34 Q60 54 0 54 Z"
                    fill="rgba(255,255,255,0.12)" />
              <text x="50" y="74" text-anchor="middle"
                    font-family="'Noto Sans Bengali','Hind Siliguri',sans-serif"
                    font-size="60" font-weight="800" fill="#ffffff">ই</text>
              <circle cx="80" cy="22" r="5.5" fill="#ffffff" />
              <circle cx="80" cy="22" r="2.2" fill="#d12053" />
            </svg>
          </div>

          <div class="brand-text">
            <h1 id="topTitle">ইজিলেনদেন</h1>
            <span class="brand-sub" id="topSub">গিলার হিসাব</span>
          </div>
        </div>

        <button class="icon-btn" id="addTop" aria-label="নতুন ব্যক্তি">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
      </div>
    </header>

    <!-- ============ HOME VIEW ============ -->
    <main class="container" id="viewHome">
      <div class="section-head">
        <h2 class="section-title"><span class="title-dot"></span>ব্যক্তিগণ</h2>
        <span class="section-count" id="personCount">০ জন</span>
      </div>
      <div class="search-wrap" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="search" id="personSearch" placeholder="নাম দিয়ে খুঁজুন"
               autocomplete="off" aria-label="ব্যক্তি খুঁজুন" />
      </div>
      <div id="personList"></div>

    </main>

    <!-- ============ PERSON VIEW ============ -->
    <main class="container view-detail" id="viewPerson" hidden></main>

    <!-- ============ PERSON MONTH VIEW ============ -->
    <main class="container view-detail" id="viewPersonMonth" hidden></main>

    <!-- ============ SHEET BACKGROUND ============ -->
    <div class="sheet-bg" id="sheetBg"></div>

    <!-- ============ PERSON SHEET ============ -->
    <div class="sheet" id="personSheet" role="dialog" aria-modal="true"
         aria-labelledby="personSheetTitle" aria-hidden="true">
      <div class="sheet-handle"></div>

      <div class="sheet-head">
        <div class="sheet-head-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
        <div>
          <h2 class="sheet-title" id="personSheetTitle">নতুন ব্যক্তি</h2>
          <p class="sheet-sub">নাম, অগ্রিম ও গিলার দাম দিন</p>
        </div>
      </div>

      <div class="field">
        <label for="pName">
          <span class="label-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          নাম
        </label>
        <input type="text" id="pName" autocomplete="off" placeholder="ব্যক্তির নাম" />
      </div>

      <div class="field">
        <label for="pAdvance">
          <span class="label-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="14" rx="3" />
              <path d="M2 10h20" />
              <circle cx="12" cy="15" r="2" />
            </svg>
          </span>
          অগ্রিম 
        </label>
        <input type="tel" id="pAdvance" inputmode="numeric" autocomplete="off" placeholder="০" />
      </div>

      <div class="field">
        <label for="pPrice">
          <span class="label-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v10M9 10h6M9 14h6" />
            </svg>
          </span>
          গিলার দাম 
        </label>
        <input type="tel" id="pPrice" inputmode="numeric" autocomplete="off" placeholder="০" />
      </div>

      <div class="btn-row">
        <button class="btn btn-ghost" id="personCancel" type="button">বাতিল</button>
        <button class="btn btn-primary" id="personSave" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          সেভ করুন
        </button>
      </div>

      <button class="day-delete" id="personDelete" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
          <path d="M10 11v6M14 11v6" />
        </svg>
        এই ব্যক্তিকে মুছুন
      </button>
    </div>

    <!-- ============ PERSON DAY SHEET ============ -->
    <div class="sheet" id="pdaySheet" role="dialog" aria-modal="true"
         aria-labelledby="pdayTitle" aria-hidden="true">
      <div class="sheet-handle"></div>

      <div class="sheet-head">
        <div class="sheet-head-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
          </svg>
        </div>
        <div>
          <h2 class="sheet-title" id="pdayTitle">নাম</h2>
          <p class="sheet-sub" id="pdaySub">আজ কত গিলা হয়েছে?</p>
        </div>
      </div>

      <div class="field">
        <label for="pdayDateDisplay">
          <span class="label-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
          </span>
          তারিখ
        </label>
        <!-- Overlay Date Picker -->
        <div class="date-picker-wrapper">
          <input type="text" id="pdayDateDisplay" placeholder="DD/MM/YYYY" readonly />
          <input type="date" id="pdayDatePicker" />
          <span class="date-picker-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </span>
        </div>
      </div>

      <div class="field">
        <label for="pdayPieces">
          <span class="label-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
            </svg>
          </span>
          গিলা সংখ্যা
        </label>
        <!-- Stepper for Pieces -->
        <div class="pieces-stepper">
          <button type="button" class="stepper-btn" id="pdayMinus">−</button>
          <input type="tel" id="pdayPieces" inputmode="numeric" autocomplete="off" placeholder="০" />
          <button type="button" class="stepper-btn" id="pdayPlus">+</button>
        </div>
        <div class="input-hint" id="pdayHint"></div>
      </div>

      <div class="btn-row">
        <button class="btn btn-ghost" id="pdayCancel" type="button">বাতিল</button>
        <button class="btn btn-primary" id="pdaySave" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          সেভ করুন
        </button>
      </div>

      <button class="day-delete" id="pdayDelete" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
          <path d="M10 11v6M14 11v6" />
        </svg>
        এই দিনের এন্ট্রি মুছুন
      </button>
    </div>

    <!-- ============ CONFIRM ============ -->
    <div class="confirm" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMsg">
      <div class="confirm-box">
        <div class="confirm-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
        </div>
        <h3 id="confirmTitle">নিশ্চিত করুন</h3>
        <p id="confirmMsg">আপনি কি নিশ্চিত?</p>
        <div class="confirm-actions">
          <button class="btn btn-ghost" id="confirmNo" type="button">বাতিল</button>
          <button class="btn btn-danger" id="confirmYes" type="button">হ্যাঁ, মুছুন</button>
        </div>
      </div>
    </div>

    <!-- ============ TOAST ============ -->
    <div class="toast" id="toast" role="status" aria-live="polite">
      <span class="toast-icon" id="toastIcon"></span>
      <span class="toast-msg" id="toastMsg"></span>
    </div>

    <script src="script.js"></script>
  </body>
</html>
