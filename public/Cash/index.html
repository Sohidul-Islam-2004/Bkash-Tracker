<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#d12053" />
    <link rel="icon" type="image/svg+xml" href="/shared/icon.svg" />
    <meta name="format-detection" content="telephone=no" />
    <title>ক্যাশের হিসাব — ইজি লেনদেন</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ============ TOPBAR / HEADER ============ -->
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <button class="icon-btn back-btn" id="backBtn" aria-label="ফিরে যান">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>

        <div class="brand">
          <div class="brand-logo" aria-hidden="true"></div>
          <div class="brand-text">
            <h1>ক্যাশের হিসাব</h1>
            <span class="brand-sub">হাতে নগদ কত আছে</span>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- MAIN HERO CARD -->
      <div class="person-hero">
        <div class="person-hero-top">
          <div class="person-hero-info">
            <h2>হাসান ক্যাশ</h2>
          </div>
          <button
            class="person-del"
            type="button"
            id="resetBtn"
            aria-label="সব মুছুন"
            title="সব মুছুন"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6M14 11v6"></path>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
            </svg>
            <span>মুছুন</span>
          </button>
        </div>

        <div class="person-hero-bal">
          <div class="bal-wrap">
            <b class="ph-bal" id="mainBalanceDisplay">৳0</b>
            <button
              class="edit-bal-btn"
              id="editBalBtn"
              aria-label="ব্যালেন্স পরিবর্তন করুন"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 20h9"></path>
                <path
                  d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"
                ></path>
              </svg>
            </button>
          </div>
          <span class="ph-state">বর্তমান ব্যালেন্স</span>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="panel">
        <div class="detail-actions" style="margin-top: 0">
          <button class="pd-btn pd-given" data-txn="given" type="button">
            ↓ হাসান দিয়েছি
          </button>
          <button class="pd-btn pd-taken" data-txn="taken" type="button">
            ↑ হাসান পেয়েছি
          </button>
        </div>
      </div>

      <!-- HISTORY -->
      <div class="panel lg-panel">
        <div class="section-head" style="margin: 0 0 12px">
          <h2 class="section-title"><span class="title-dot"></span>লেনদেন</h2>
          <span class="section-count" id="txnCount">০</span>
        </div>
        <div id="ledgerList"></div>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div id="modalRoot"></div>

    <script src="/shared/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
