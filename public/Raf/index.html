<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#d12053" />
  <title>রাফ হিসাব</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ TOPBAR ============ -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-icon">র</div>
        <div class="brand-text">
          <h1>রাফ হিসাব</h1>
          <span>সহজ এন্ট্রি ম্যানেজার</span>
        </div>
      </div>
      <button class="add-btn" id="addBtn" aria-label="নতুন এন্ট্রি">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ============ LIST ============ -->
  <main class="container">
    <div class="list-head">
      <h2><span class="dot"></span>সব এন্ট্রি</h2>
      <span class="count-badge" id="countBadge">০</span>
    </div>
    <div id="entryList"></div>
  </main>

  <!-- ============ SHEET ============ -->
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>

    <div class="sheet-head">
      <div>
        <h2>নতুন এন্ট্রি</h2>
        <p>এন্ট্রি পেস্ট করে সেভ করুন</p>
      </div>
      <button class="close-btn" id="closeBtn" aria-label="বন্ধ করুন">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <!-- Entry paste -->
    <div class="field">
      <label for="entryInput">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
          </svg>
        </span>
        এন্ট্রি পেস্ট করুন
      </label>
      <div class="ta-wrap">
        <textarea id="entryInput" rows="6" placeholder="01609496296 # 26520&#10;01806-289077- 10200&#10;01711210046-510&#10;01977988097-5100"></textarea>
        <button class="paste-btn" id="pasteBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
            <rect x="8" y="2" width="8" height="4" rx="1" />
          </svg>
          পেস্ট
        </button>
      </div>
      <div class="hint">প্রতি লাইনে: ১১-ডিজিট নম্বর তারপর # বা - চিহ্ন, তারপর টাকা</div>
    </div>

    <!-- Note -->
    <div class="field">
      <label for="noteInput">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
          </svg>
        </span>
        নোট <span class="opt">ঐচ্ছিক</span>
      </label>
      <textarea id="noteInput" rows="2" placeholder="যেমন: বিকাশে ৫০০ টাকা কম এসেছে"></textarea>
    </div>

    <button class="save-btn" id="saveBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12" />
      </svg>
      সেভ করুন
    </button>
  </div>

  <!-- ============ CONFIRM ============ -->
  <div class="confirm" id="confirm">
    <div class="confirm-box">
      <h3>নিশ্চিত করুন</h3>
      <p id="confirmMsg">আপনি কি এই এন্ট্রিটি মুছতে চান?</p>
      <div class="confirm-actions">
        <button class="btn-cancel" id="confirmNo" type="button">বাতিল</button>
        <button class="btn-danger" id="confirmYes" type="button">হ্যাঁ, মুছুন</button>
      </div>
    </div>
  </div>

  <!-- ============ TOAST ============ -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
