<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d12053" />
    <title>হিসাব চেকার — ইজি লেনদেন</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <button class="back-btn" id="backBtn" aria-label="ফিরে যান">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>
        <div class="brand">
          <div class="brand-logo" aria-hidden="true"></div>
          <div class="brand-text">
            <h1>হিসাব চেকার</h1>
            <span class="brand-sub">সালাম ও হাসানের এন্ট্রি মিলিয়ে দেখা</span>
          </div>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="box">
        <div class="box-head">
          <label for="salamInput"><span class="who who-salam">স</span>সালামের এন্ট্রি</label>
          <button class="mini" data-paste="salamInput" type="button">পেস্ট</button>
        </div>
        <textarea id="salamInput" spellcheck="false" placeholder="সালাম ভাইয়ের মেসেজ এখানে পেস্ট করুন&#10;01712345678 = 5000&#10;01812345678 # 10200"></textarea>
        <div class="errs" id="salamErrs" hidden></div>
      </section>

      <section class="box">
        <div class="box-head">
          <label for="hasanInput"><span class="who who-hasan">হ</span>হাসানের এন্ট্রি</label>
          <button class="mini" data-paste="hasanInput" type="button">পেস্ট</button>
        </div>
        <textarea id="hasanInput" spellcheck="false" placeholder="হাসানের মেসেজ এখানে পেস্ট করুন&#10;01712345678 = 5000&#10;01812345678 # 10200"></textarea>
        <div class="errs" id="hasanErrs" hidden></div>
      </section>

      <div class="actions">
        <button class="btn-ghost" id="clearBtn" type="button">মুছুন</button>
        <button class="btn-main" id="checkBtn" type="button">মিলিয়ে দেখুন</button>
      </div>

      <section id="result" hidden></section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
  </body>
</html>
