<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#d12053" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "dark" ? "#181b24" : "#d12053");
        } catch (e) {}
      })();
    </script>
    <title>বিকাশ হিসাব</title>

    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ============================================================
         TOP BAR
    ============================================================ -->
    <header class="topbar">
      <div class="topbar-left">
        <!-- Back button (smart — handled by script.js) -->
        <button class="back-btn" id="backBtn" aria-label="ফিরে যান">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>

        <img id="brandLogo" alt="লোগো" />
        <div class="topbar-titles">
          <h1>বিকাশ হিসাব</h1>
        </div>

        <!-- Dark / Light toggle -->
        <button class="theme-btn" id="themeBtn" aria-label="থিম পরিবর্তন করুন" title="ডার্ক / লাইট">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6" />
          </svg>
        </button>
      </div>
    </header>

    <!-- ============================================================
         MAIN CONTAINER
    ============================================================ -->
    <main class="container">
      <!-- ========================================================
             VIEW: DASHBOARD
        ========================================================= -->
      <section id="viewDashboard" class="view">
        <div id="searchBar" class="searchbar">
          <input
            id="searchBox"
            type="search"
            placeholder="নাম বা নম্বর খুঁজুন"
            oninput="renderDashboard()"
            autocomplete="off"
          />
          <button
            class="add-btn"
            onclick="showAddPerson()"
            aria-label="নতুন মানুষ যোগ করুন"
          >
            <i>+</i> যোগ
          </button>
        </div>
        <div class="summary">
          <div class="summary-item">
            <span>মোট মানুষ</span><b id="totalPeople">0</b>
          </div>
          <div class="summary-item">
            <span>মোট ব্যালেন্স</span><b id="totalBalance">৳0</b>
          </div>
        </div>
        <div id="peopleGrid" class="people-grid"></div>
      </section>

      <!-- ========================================================
             VIEW: ADD PERSON
        ========================================================= -->
      <section id="viewAddPerson" class="view hidden">
        <div class="panel">
          <h2 class="panel-title">
            <span class="panel-title-icon">✨</span>
            নতুন মানুষের হিসাব
          </h2>

          <form onsubmit="submitPerson(event)">
            <!-- Photo -->
            <div class="field photo-field">
              <div class="photo-picker">
                <div id="photoFallback" class="avatar avatar-xl">?</div>
                <img id="photoPreview" class="avatar avatar-xl hidden" alt="" />
                <label class="photo-btn">
                  📷 ছবি নিন
                  <input
                    name="photo"
                    type="file"
                    accept="image/*"
                    onchange="previewPhoto(event)"
                    hidden
                  />
                </label>
              </div>
            </div>

            <!-- Name -->
            <div class="field">
              <label>নাম</label>
              <input
                name="name"
                type="text"
                required
                placeholder="যেমন: করিম"
                autocomplete="off"
              />
            </div>

            <!-- bKash number -->
            <div class="field">
              <label>বিকাশ নম্বর</label>
              <input
                name="bKashNumber"
                type="tel"
                required
                pattern="01[0-9]{9}"
                placeholder="01XXXXXXXXX"
                maxlength="11"
                inputmode="numeric"
              />
            </div>

            <!-- WhatsApp -->
            <div class="field">
              <label
                >হোয়াটসঅ্যাপ নম্বর
                <span class="opt">(না দিলেও চলবে)</span></label
              >
              <input
                name="whatsappNumber"
                type="tel"
                placeholder="8801XXXXXXXXX"
                inputmode="numeric"
              />
            </div>

            <!-- Current balance -->
            <div class="field">
              <label>এখন কত টাকা আছে?</label>
              <input
                name="initialBalance"
                type="number"
                step="1"
                value=""
                inputmode="numeric"
              />
            </div>

            <!-- Used baseline -->
            <h3 class="section-label">💸 এখন পর্যন্ত কত টাকা পাঠানো হয়েছে?</h3>

            <div class="row">
              <div class="field">
                <label>দৈনিক লিমিট</label>
                <input
                  name="dailyUsedBase"
                  type="number"
                  min="0"
                  value=""
                  inputmode="numeric"
                />
              </div>
              <div class="field">
                <label>মাসিক লিমিট</label>
                <input
                  name="monthlyUsedBase"
                  type="number"
                  min="0"
                  value=""
                  inputmode="numeric"
                />
              </div>
            </div>

            <div class="info">
              <span class="info-icon">💡</span>
              <div>
                আজ ও এই মাসে পাঠানো টাকার পরিমাণ লিখুন। বাকি টাকা অ্যাপ নিজেই
                হিসাব করে দেখাবে।
              </div>
            </div>

            <button class="btn btn-primary btn-block btn-xl" type="submit">
              ✔ সংরক্ষণ করুন
            </button>
          </form>
        </div>
      </section>

      <!-- ========================================================
             VIEW: PERSON DETAIL
        ========================================================= -->
      <section id="viewPerson" class="view hidden">
        <div id="personDetail"></div>
      </section>
    </main>

    <!-- ============================================================
         TOAST + MODAL ROOT
    ============================================================ -->
    <div class="toast" id="toast"></div>
    <div id="modalRoot"></div>

    <script src="script.js"></script>
  </body>
</html>
