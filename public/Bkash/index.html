<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#d12053" />
    <link rel="icon" type="image/svg+xml" href="/shared/icon.svg" />
    <title>বিকাশ ম্যানেজমেন্ট — ইজি লেনদেন</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ============================================================
         TOP BAR
    ============================================================ -->
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <button class="back-btn" id="backBtn" aria-label="ফিরে যান">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>

        <div class="brand">
          <div class="brand-logo" aria-hidden="true"></div>
          <div class="brand-text">
            <h1>বিকাশ ম্যানেজমেন্ট</h1>
            <span class="brand-sub">ব্যালেন্স ও লিমিট</span>
          </div>
        </div>
      </div>
    </header>

    <!-- ============================================================
         MAIN CONTAINER
    ============================================================ -->
    <main class="container">
      <!-- ========================================================
             VIEW: DASHBOARD
        ========================================================= -->
      <section id="viewDashboard" class="view">
        <div id="searchBar" class="searchbar">
          <input
            id="searchBox"
            type="search"
            placeholder="নাম বা নম্বর খুঁজুন"
            oninput="renderDashboard()"
            autocomplete="off"
          />
          <button
            class="add-btn"
            onclick="showAddPerson()"
            aria-label="নতুন মানুষ যোগ করুন"
          >
            <i>+</i> যোগ
          </button>
        </div>
      <!-- Replace the old summary div with this new card -->
<div class="summary-card">
    <div class="summary-header">
        <div class="summary-title">
            <span class="taka-icon">৳</span>
            <span>মোট ব্যালেন্স</span>
        </div>
   
    </div>
    <div class="summary-amount" id="totalBalance">৳0</div>
    <div class="summary-footer">
        মোট মানুষ: <b id="totalPeople">0</b> জন
    </div>
</div>
        <div id="peopleGrid" class="people-grid"></div>
      </section>

      <!-- ========================================================
             VIEW: ADD PERSON
        ========================================================= -->
      <section id="viewAddPerson" class="view hidden">
        <div class="panel">
          <h2 class="panel-title">
            <span class="panel-title-icon">✨</span>
            নতুন মানুষের হিসাব
          </h2>

                  <form onsubmit="submitPerson(event)">
            <!-- Photo -->
            <div class="field photo-field">
              <div class="photo-picker">
                <div id="photoFallback" class="avatar avatar-xl">?</div>
                <img id="photoPreview" class="avatar avatar-xl hidden" alt="" />
                <label class="photo-btn">
                  📷 ছবি নিন
                  <input
                    name="photo"
                    type="file"
                    accept="image/*"
                    onchange="previewPhoto(event)"
                    hidden
                  />
                </label>
              </div>
            </div>

            <!-- Name -->
            <div class="field">
              <label>নাম</label>
              <input
                name="name"
                type="text"
                required
                placeholder="যেমন: করিম"
                autocomplete="off"
              />
            </div>

            <!-- bKash number -->
            <div class="field">
              <label>বিকাশ নম্বর</label>
              <input
                name="bKashNumber"
                type="tel"
                required
                pattern="01[0-9]{9}"
                placeholder="01XXXXXXXXX"
                maxlength="11"
                inputmode="numeric"
              />
            </div>

            <!-- WhatsApp -->
            <div class="field">
              <label
                >হোয়াটসঅ্যাপ নম্বর
                <span class="opt">(না দিলেও চলবে)</span></label
              >
              <input
                name="whatsappNumber"
                type="tel"
                placeholder="8801XXXXXXXXX"
                inputmode="numeric"
              />
            </div>

            <!-- Current balance -->
            <div class="field">
              <label>এখন কত টাকা আছে?</label>
              <input
                name="initialBalance"
                type="number"
                step="1"
                value=""
                inputmode="numeric"
              />
            </div>

            <!-- Used baseline -->
            <h3 class="section-label">💸 এখন পর্যন্ত কত টাকা পাঠানো হয়েছে?</h3>

            <div class="row">
              <div class="field">
                <label>দৈনিক লিমিট</label>
                <input
                  name="dailyUsedBase"
                  type="number"
                  min="0"
                  value=""
                  inputmode="numeric"
                />
              </div>
              <div class="field">
                <label>মাসিক লিমিট</label>
                <input
                  name="monthlyUsedBase"
                  type="number"
                  min="0"
                  value=""
                  inputmode="numeric"
                />
              </div>
            </div>

            <!-- Bundle -->
            <h3 class="section-label">📦 সেন্ড মানি বান্ডেল (ঐচ্ছিক)</h3>

            <div class="row">
              <div class="field">
                <label>বান্ডেল সংখ্যা</label>
                <input
                  name="bundleCount"
                  type="number"
                  min="0"
                  value=""
                  inputmode="numeric"
                  placeholder="0"
                />
              </div>
              <div class="field">
                <label
                  >মেয়াদ শেষের তারিখ
                  <span class="opt">(না দিলে ৩০ দিন)</span></label
                >
                <input name="bundleExpiry" type="date" />
              </div>
            </div>

            <div class="info">
              <span class="info-icon">💡</span>
              <div>
                আজ ও এই মাসে পাঠানো টাকার পরিমাণ লিখুন। বাকি টাকা অ্যাপ নিজেই
                হিসাব করে দেখাবে।
              </div>
            </div>

            <button class="btn btn-primary btn-block btn-xl" type="submit">
              ✔ সংরক্ষণ করুন
            </button>
          </form>
        </div>
      </section>

      <!-- ========================================================
             VIEW: PERSON DETAIL
        ========================================================= -->
      <section id="viewPerson" class="view hidden">
        <div id="personDetail"></div>
      </section>
    </main>

    <!-- ============================================================
         TOAST + MODAL ROOT
    ============================================================ -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div id="modalRoot"></div>

    <script src="/shared/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
