<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#c2185b" />
    <title>বিকাশ হিসাব</title>

    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ============================================================
         TOP BAR
    ============================================================ -->
    <header class="topbar">
      <div class="topbar-left">
        <!-- Back button (smart — handled by script.js) -->
        <button class="back-btn" id="backBtn" aria-label="ফিরে যান">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>

        <img id="brandLogo" alt="লোগো" />

        <div class="topbar-titles">
          <h1>বিকাশ হিসাব</h1>
        </div>
      </div>
    </header>

    <!-- ============================================================
         MAIN CONTAINER
    ============================================================ -->
    <main class="container">
      <!-- ========================================================
             VIEW: DASHBOARD
        ========================================================= -->
      <section id="viewDashboard" class="view">
        <div id="searchBar" class="searchbar">
          <input
            id="searchBox"
            type="search"
            placeholder="নাম বা নম্বর খুঁজুন"
            oninput="renderDashboard()"
            autocomplete="off"
          />
          <button
            class="add-btn"
            onclick="showAddPerson()"
            aria-label="নতুন মানুষ যোগ করুন"
          >
            <i>+</i> যোগ
          </button>
        </div>

        <div class="summary-card">
          <div class="summary-header">
            <div class="summary-title">
              <span class="taka-icon">৳</span>
              <span>মোট ব্যালেন্স</span>
            </div>
          </div>
          <div class="summary-amount" id="totalBalance">৳0</div>
          <div class="summary-footer">
            মোট মানুষ: <b id="totalPeople">0</b> জন
          </div>
        </div>

        <div id="peopleGrid" class="people-grid"></div>
      </section>

      <!-- ========================================================
             VIEW: ADD PERSON
        ========================================================= -->
      <section id="viewAddPerson" class="view hidden">
        <div class="panel">
          <h2 class="panel-title">
            <span class="panel-title-icon">✨</span>
            নতুন মানুষের হিসাব
          </h2>

          <form onsubmit="submitPerson(event)">
            <!-- Name -->
            <div class="field">
              <label for="f-name">নাম</label>
              <input
                id="f-name"
                name="name"
                type="text"
                required
                placeholder="যেমন: করিম"
                autocomplete="off"
              />
            </div>

            <!-- Numbers -->
            <div class="row">
              <div class="field">
                <label for="f-bkash">বিকাশ নম্বর</label>
                <input
                  id="f-bkash"
                  name="bKashNumber"
                  type="tel"
                  required
                  pattern="01[0-9]{9}"
                  placeholder="01XXXXXXXXX"
                  maxlength="11"
                  inputmode="numeric"
                />
              </div>
              <div class="field">
                <label for="f-wa"
                  >হোয়াটসঅ্যাপ নম্বর
                  <span class="opt">(না দিলেও চলবে)</span></label
                >
                <input
                  id="f-wa"
                  name="whatsappNumber"
                  type="tel"
                  placeholder="8801XXXXXXXXX"
                  inputmode="numeric"
                />
              </div>
            </div>

            <!-- Current balance -->
            <div class="field">
              <label for="f-balance">এখন কত টাকা আছে?</label>
              <input
                id="f-balance"
                name="initialBalance"
                type="number"
                step="1"
                value=""
                placeholder="0"
                inputmode="numeric"
              />
            </div>

            <!-- Used baseline -->
            <h3 class="section-label">💸 এখন পর্যন্ত কত টাকা পাঠানো হয়েছে?</h3>

            <div class="row">
              <div class="field">
                <label for="f-daily">দৈনিক লিমিট</label>
                <input
                  id="f-daily"
                  name="dailyUsedBase"
                  type="number"
                  min="0"
                  value=""
                  placeholder="0"
                  inputmode="numeric"
                />
              </div>
              <div class="field">
                <label for="f-monthly">মাসিক লিমিট</label>
                <input
                  id="f-monthly"
                  name="monthlyUsedBase"
                  type="number"
                  min="0"
                  value=""
                  placeholder="0"
                  inputmode="numeric"
                />
              </div>
            </div>

            <!-- Bundle -->
            <h3 class="section-label">📦 সেন্ড মানি বান্ডেল (ঐচ্ছিক)</h3>

            <div class="row">
              <div class="field">
                <label for="f-bundle">বান্ডেল সংখ্যা</label>
                <input
                  id="f-bundle"
                  name="bundleCount"
                  type="number"
                  min="0"
                  value=""
                  inputmode="numeric"
                  placeholder="0"
                />
              </div>
              <div class="field">
                <label for="f-expiry"
                  >মেয়াদ শেষের তারিখ
                  <span class="opt">(না দিলে ৩০ দিন)</span></label
                >
                <input id="f-expiry" name="bundleExpiry" type="date" />
              </div>
            </div>

            <div class="info">
              <span class="info-icon">💡</span>
              <div>
                আজ ও এই মাসে পাঠানো টাকার পরিমাণ লিখুন। বাকি টাকা অ্যাপ নিজেই
                হিসাব করে দেখাবে।
              </div>
            </div>

            <button class="btn btn-primary btn-block btn-xl" type="submit">
              ✔ সংরক্ষণ করুন
            </button>
          </form>
        </div>
      </section>

      <!-- ========================================================
             VIEW: PERSON DETAIL
        ========================================================= -->
      <section id="viewPerson" class="view hidden">
        <div id="personDetail"></div>
      </section>
    </main>

    <!-- ============================================================
         TOAST + MODAL ROOT
    ============================================================ -->
    <div class="toast" id="toast"></div>
    <div id="modalRoot"></div>

    <script src="script.js"></script>
    <link rel="stylesheet" href="/assistant/assistant.css" />
    <script src="/assistant/assistant.js" defer></script>
  </body>
</html>
