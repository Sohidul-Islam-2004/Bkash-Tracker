<!doctype html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d12053" />
    <title>বিকাশ হিসাব</title>

    <link rel="stylesheet" href="style.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    />
</head>

<body>

    <!-- ============================================================
         TOP BAR
    ============================================================ -->
    <header class="topbar">
        <div class="topbar-left">
            <img id="brandLogo" alt="লোগো" />
            <div class="topbar-titles">
                <h1>বিকাশ হিসাব</h1>
                <span class="sub">টাকার হিসাব</span>
            </div>
        </div>
    </header>


    <!-- ============================================================
         MAIN CONTAINER
    ============================================================ -->
    <main class="container">

        <!-- ========================================================
             VIEW: DASHBOARD
        ========================================================= -->
        <section id="viewDashboard" class="view">

            <div id="searchBar" class="searchbar">
                <input
                    id="searchBox"
                    type="search"
                    placeholder="নাম বা নম্বর খুঁজুন"
                    oninput="renderDashboard()"
                    autocomplete="off"
                />
                <button
                    class="add-btn"
                    onclick="showAddPerson()"
                    aria-label="নতুন মানুষ যোগ করুন"
                >
                    <i>+</i> যোগ
                </button>
            </div>

            <div id="peopleGrid" class="people-grid"></div>
        </section>


        <!-- ========================================================
             VIEW: ADD PERSON
        ========================================================= -->
        <section id="viewAddPerson" class="view hidden">

            <button class="back" onclick="showDashboard()">
                <span>←</span> ফিরে যান
            </button>

            <div class="panel">

                <h2 class="panel-title">
                    <span class="panel-title-icon">✨</span>
                    নতুন মানুষের হিসাব
                </h2>

                <form onsubmit="submitPerson(event)">

                    <!-- Photo -->
                    <div class="field photo-field">
                        <div class="photo-picker">
                            <div id="photoFallback" class="avatar avatar-xl">?</div>
                            <img id="photoPreview" class="avatar avatar-xl hidden" alt="" />
                            <label class="photo-btn">
                                📷 ছবি নিন
                                <input
                                    name="photo"
                                    type="file"
                                    accept="image/*"
                                    onchange="previewPhoto(event)"
                                    hidden
                                />
                            </label>
                        </div>
                    </div>

                    <!-- Name -->
                    <div class="field">
                        <label>নাম</label>
                        <input
                            name="name"
                            type="text"
                            required
                            placeholder="যেমন: করিম"
                            autocomplete="off"
                        />
                    </div>

                    <!-- bKash number -->
                    <div class="field">
                        <label>বিকাশ নম্বর</label>
                        <input
                            name="bKashNumber"
                            type="tel"
                            required
                            pattern="01[0-9]{9}"
                            placeholder="01XXXXXXXXX"
                            maxlength="11"
                            inputmode="numeric"
                        />
                    </div>

                    <!-- WhatsApp -->
                    <div class="field">
                        <label>হোয়াটসঅ্যাপ নম্বর <span class="opt">(না দিলেও চলবে)</span></label>
                        <input
                            name="whatsappNumber"
                            type="tel"
                            placeholder="8801XXXXXXXXX"
                            inputmode="numeric"
                        />
                    </div>

                    <!-- Current balance -->
                    <div class="field">
                        <label>এখন কত টাকা আছে?</label>
                        <input
                            name="initialBalance"
                            type="number"
                            step="1"
                            value="0"
                            inputmode="numeric"
                        />
                    </div>

                    <!-- Used baseline -->
                    <h3 class="section-label">
                        💸 এখন পর্যন্ত কত টাকা পাঠানো হয়েছে?
                    </h3>

                    <div class="row">
                        <div class="field">
                            <label>আজ</label>
                            <input
                                name="dailyUsedBase"
                                type="number"
                                min="0"
                                value="0"
                                inputmode="numeric"
                            />
                        </div>
                        <div class="field">
                            <label>এই মাসে</label>
                            <input
                                name="monthlyUsedBase"
                                type="number"
                                min="0"
                                value="0"
                                inputmode="numeric"
                            />
                        </div>
                    </div>

                    <div class="info">
                        <span class="info-icon">💡</span>
                        <div>
                            আজ ও এই মাসে পাঠানো টাকার পরিমাণ লিখুন।
                            বাকি টাকা অ্যাপ নিজেই হিসাব করে দেখাবে।
                        </div>
                    </div>

                    <button class="btn btn-primary btn-block btn-xl" type="submit">
                        ✔ সংরক্ষণ করুন
                    </button>
                </form>
            </div>
        </section>


        <!-- ========================================================
             VIEW: PERSON DETAIL
        ========================================================= -->
        <section id="viewPerson" class="view hidden">

            <button class="back" onclick="showDashboard()">
                <span>←</span> ফিরে যান
            </button>

            <div id="personDetail"></div>
        </section>

    </main>


    <!-- ============================================================
         TOAST + MODAL ROOT
    ============================================================ -->
    <div class="toast" id="toast"></div>
    <div id="modalRoot"></div>

    <script src="script.js"></script>
</body>
</html>
