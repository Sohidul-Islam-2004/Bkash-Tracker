<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d12053" />
    <link rel="icon" type="image/svg+xml" href="/shared/icon.svg" />
    <title>ইজি লেনদেন</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com" rel="stylesheet" />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/home.css" />
  </head>
  <body>
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true"></div>
          <div class="brand-text">
            <h1>ইজি লেনদেন</h1>
            <span class="brand-sub">ড্যাশবোর্ড</span>
          </div>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <span class="hero-day" id="heroDay"></span>
        <b class="hero-date" id="heroDate"></b>
        <span class="hero-note">কোন হিসাবটা খুলবেন, নিচ থেকে বেছে নিন</span>
      </section>

      <div class="section-head">
        <div class="section-title"><span class="title-dot"></span>সেবাসমূহ</div>
        <span class="section-count" id="svcCount"></span>
      </div>

      <nav class="services" id="services" aria-label="সেবাসমূহ"></nav>
    </main>

    <script src="/shared/app.js"></script>
    <script src="/home.js"></script>
  </body>
</html>
