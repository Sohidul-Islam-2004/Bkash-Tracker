<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>বিকাশ হিসাব</title>
    <link rel="stylesheet" href="style.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div style="display: flex; align-items: center; gap: 14px">
        <img id="brandLogo" alt="লোগো" title="লোগো বদলাতে চাপুন" />
        <div>
          <h1>বিকাশ হিসাব</h1>
          <div class="sub">টাকার হিসাব রাখার সহজ অ্যাপ</div>
        </div>
      </div>
      <div class="toolbar">
        <button class="btn btn-ghost" onclick="exportCSV()">
          📥 এক্সপোর্ট
        </button>
      </div>
    </header>

    <div class="container">
      <section id="viewDashboard">
        <div class="toolbar" style="margin-bottom: 20px">
          <button class="btn btn-primary" onclick="showAddPerson()">
            ➕ নতুন মানুষ যোগ করুন
          </button>
        </div>
        <div id="peopleGrid" class="grid cards"></div>
      </section>

      <section id="viewAddPerson" class="hidden">
        <button class="back" onclick="showDashboard()">← ফিরে যান</button>
        <div class="panel" style="max-width: 600px">
          <h2>✨ নতুন মানুষের হিসাব</h2>
          <form onsubmit="submitPerson(event)">
            <div class="field">
              <label>ছবি (না দিলেও চলবে)</label>
              <div class="photo-row">
                <div id="photoFallback" class="avatar avatar-lg">?</div>
                <img id="photoPreview" class="avatar avatar-lg hidden" alt="" />
                <input
                  name="photo"
                  type="file"
                  accept="image/*"
                  onchange="previewPhoto(event)"
                />
              </div>
            </div>

            <div class="field">
              <label>নাম</label>
              <input name="name" required placeholder="যেমন: করিম" />
            </div>

            <div class="field">
              <label>বিকাশ নম্বর</label>
              <input
                name="bKashNumber"
                required
                pattern="01[0-9]{9}"
                placeholder="01XXXXXXXXX"
                maxlength="11"
                inputmode="numeric"
              />
            </div>

            <div class="field">
              <label>হোয়াটসঅ্যাপ নম্বর (না দিলেও চলবে)</label>
              <input
                name="whatsappNumber"
                placeholder="8801XXXXXXXXX"
                inputmode="numeric"
              />
            </div>

            <div class="field">
              <label>এখন কত টাকা আছে?</label>
              <input
                name="initialBalance"
                type="number"
                step="1"
                value="0"
                inputmode="numeric"
              />
            </div>

            <h2
              style="font-size: 16px; margin: 24px 0 14px; color: var(--muted)"
            >
              💸 এখন পর্যন্ত কত টাকা পাঠানো হয়েছে?
            </h2>

            <div class="row">
              <div class="field">
                <label>আজ পাঠানো হয়েছে</label>
                <input
                  name="dailyUsedBase"
                  type="number"
                  min="0"
                  value="0"
                  inputmode="numeric"
                />
              </div>
              <div class="field">
                <label>এই মাসে পাঠানো হয়েছে</label>
                <input
                  name="monthlyUsedBase"
                  type="number"
                  min="0"
                  value="0"
                  inputmode="numeric"
                />
              </div>
            </div>

            <div class="info">
              <span style="font-size: 20px">💡</span>
              <div>
                আজ কত টাকা পাঠানো হয়েছে আর এই মাসে কত টাকা পাঠানো হয়েছে, সেটা
                লিখুন। বাকি টাকা অ্যাপ নিজেই হিসাব করে দেখাবে।
                <br /><br />
                দিন শেষ হলে আজকের হিসাব, আর মাস শেষ হলে মাসের হিসাব নিজে থেকেই
                নতুন হবে।
              </div>
            </div>

            <button
              class="btn btn-primary btn-block"
              type="submit"
              style="margin-top: 10px"
            >
              ✔ সংরক্ষণ করুন
            </button>
          </form>
        </div>
      </section>

      <section id="viewPerson" class="hidden">
        <button class="back" onclick="showDashboard()">← ফিরে যান</button>
        <div id="personDetail"></div>
      </section>
    </div>

    <div class="toast" id="toast"></div>
    <div id="modalRoot"></div>

    <script src="script.js"></script>
  </body>
</html>
