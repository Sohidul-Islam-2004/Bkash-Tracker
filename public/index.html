<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#d12053" />
    <title>ইজিলেনদেন — ড্যাশবোর্ড</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@500;600;700;800&family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --bg: #f5f3f6;
        --card: #ffffff;

        --ink: #17181f;
        --ink-2: #3a3d4a;
        --muted: #6e7180;
        --muted-2: #a1a4b3;
        --line: #ebe6ec;
        --line-2: #f3eef4;

        --pink: #d12053;
        --pink-2: #e8437a;
        --pink-press: #a8153f;
        --pink-soft: #fde8ef;
        --pink-tint: #fff6fa;

        --top: env(safe-area-inset-top, 0px);
        --bottom: env(safe-area-inset-bottom, 0px);

        --shadow-xs: 0 1px 2px rgba(20, 22, 34, 0.04);
        --shadow-sm: 0 2px 6px rgba(20, 22, 34, 0.05);
        --shadow: 0 4px 14px rgba(20, 22, 34, 0.06);
        --shadow-md: 0 10px 30px rgba(20, 22, 34, 0.08);
        --shadow-lg: 0 24px 48px rgba(20, 22, 34, 0.12);
        --shadow-pink: 0 8px 22px rgba(209, 32, 83, 0.28);

        --r-sm: 12px;
        --r: 16px;
        --r-md: 20px;
        --r-lg: 24px;

        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);

        --font-num:
          "Noto Sans Bengali", "Hind Siliguri", "Inter", -apple-system,
          BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-body:
          "Hind Siliguri", "Noto Sans Bengali", -apple-system,
          BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        background-image: radial-gradient(
          1200px 600px at 50% -200px,
          rgba(209, 32, 83, 0.08),
          transparent 70%
        );
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: 0;
        background: none;
        -webkit-tap-highlight-color: transparent;
      }

      .icon {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: 0 0 auto;
      }

      /* ============ APP SHELL ============ */
      .app {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      /* ============ TOPBAR (matches entry manager) ============ */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: saturate(180%) blur(14px);
        -webkit-backdrop-filter: saturate(180%) blur(14px);
        border-bottom: 1px solid var(--line-2);
        padding: calc(10px + var(--top)) 16px 10px;
        transition: box-shadow 0.25s var(--ease);
      }

      .topbar.scrolled {
        box-shadow: 0 1px 10px rgba(20, 22, 34, 0.05);
      }

      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        flex: 1;
      }

      /* ---------- brand logo (SVG monogram) ---------- */
      .brand-logo {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        flex-shrink: 0;
        overflow: hidden;
        box-shadow: var(--shadow-pink);
        background: transparent;
        display: grid;
        place-items: center;
        position: relative;
      }

      .brand-logo .brand-mark {
        width: 100%;
        height: 100%;
        display: block;
      }

      .brand-text {
        min-width: 0;
        line-height: 1.2;
      }

      .brand-text h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--ink);
      }

      .brand-sub {
        display: block;
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ============ CONTENT ============ */
      .content {
        flex: 1;
        padding: 16px 14px calc(32px + var(--bottom));
      }

      /* ============ SECTION TITLE ============ */
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 4px 2px 12px;
      }

      .section-title {
        font-size: 15px;
        font-weight: 700;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        letter-spacing: -0.2px;
      }

      .title-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--pink);
        box-shadow: 0 0 0 3px rgba(209, 32, 83, 0.12);
      }

      .section-count {
        font-family: var(--font-num);
        font-size: 12px;
        font-weight: 700;
        color: var(--pink);
        background: var(--pink-soft);
        padding: 4px 10px;
        border-radius: 20px;
        letter-spacing: 0.2px;
        font-variant-numeric: tabular-nums;
      }

      /* ============ SERVICES GRID ============ */
      .services {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .service {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        padding: 18px 16px;
        border-radius: var(--r-md);
        background: var(--card);
        border: 1px solid var(--line-2);
        box-shadow: var(--shadow-sm);
        text-align: left;
        transition:
          transform 0.2s var(--ease),
          box-shadow 0.25s var(--ease),
          border-color 0.2s var(--ease);
        position: relative;
        overflow: hidden;
        animation: cardIn 0.4s var(--ease) backwards;
        min-height: 130px;
      }

      .service:nth-child(1) {
        animation-delay: 0.05s;
      }
      .service:nth-child(2) {
        animation-delay: 0.1s;
      }
      .service:nth-child(3) {
        animation-delay: 0.15s;
      }
      .service:nth-child(4) {
        animation-delay: 0.2s;
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .service:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
        border-color: rgba(209, 32, 83, 0.18);
      }

      .service:active {
        transform: translateY(0) scale(0.99);
        background: var(--pink-tint);
      }

      .service-ico {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--pink), var(--pink-press));
        color: #fff;
        box-shadow: var(--shadow-pink);
        position: relative;
        z-index: 1;
        flex-shrink: 0;
      }

      .service-ico .icon {
        width: 22px;
        height: 22px;
        stroke-width: 2.4;
      }

      .service b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.2px;
        line-height: 1.35;
        color: var(--ink);
        position: relative;
        z-index: 1;
      }

      /* ============ TOAST (matches entry manager) ============ */
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(32px + var(--bottom));
        transform: translate(-50%, 24px);
        background: var(--ink);
        color: #fff;
        padding: 13px 20px;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 16px 40px rgba(20, 22, 34, 0.3);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.28s var(--ease),
          transform 0.32s var(--ease);
        z-index: 300;
        max-width: 90vw;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (min-width: 480px) {
        .content {
          padding: 20px 18px calc(40px + var(--bottom));
        }
      }
    </style>
  </head>
  <body>
    <!-- ============ ICON SPRITE ============ -->
    <svg style="display: none" aria-hidden="true">
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
      </symbol>
      <symbol id="i-users" viewBox="0 0 24 24">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </symbol>
    </svg>

    <!-- ============ APP ============ -->
    <div class="app">
      <!-- HEADER (glass, sticky) -->
      <header class="topbar" id="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <div class="brand-logo" aria-hidden="true">
              <svg
                class="brand-mark"
                viewBox="0 0 100 100"
                xmlns="http://www.w3.org/2000/svg"
              >
                <defs>
                  <linearGradient
                    id="el-grad"
                    x1="0"
                    y1="0"
                    x2="100"
                    y2="100"
                    gradientUnits="userSpaceOnUse"
                  >
                    <stop offset="0%" stop-color="#e8437a" />
                    <stop offset="55%" stop-color="#d12053" />
                    <stop offset="100%" stop-color="#a8153f" />
                  </linearGradient>
                </defs>

                <!-- tile -->
                <rect width="100" height="100" rx="24" fill="url(#el-grad)" />

                <!-- top-left sheen -->
                <path
                  d="M0 24 Q0 0 24 0 L76 0 Q100 0 100 24 L100 34 Q60 54 0 54 Z"
                  fill="rgba(255,255,255,0.10)"
                />

                <!-- ই -->
                <text
                  x="50"
                  y="74"
                  text-anchor="middle"
                  font-family="'Noto Sans Bengali','Hind Siliguri',sans-serif"
                  font-size="60"
                  font-weight="800"
                  fill="#ffffff"
                >
                  ই
                </text>

                <!-- coin accent -->
                <circle cx="80" cy="22" r="5.5" fill="#ffffff" />
                <circle cx="80" cy="22" r="2.2" fill="#d12053" />
              </svg>
            </div>
            <div class="brand-text">
              <h1>ইজি লেনদেন</h1>
              <span class="brand-sub">ড্যাশবোর্ড</span>
            </div>
          </div>
        </div>
      </header>

      <!-- CONTENT -->
      <main class="content">
        <div class="section-head">
          <h2 class="section-title"><span class="title-dot"></span>সেবাসমূহ</h2>
          <span class="section-count" id="svcCount">০ টি</span>
        </div>

        <div class="services" id="servicesGrid"></div>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      (() => {
        "use strict";

        const $ = (s, c = document) => c.querySelector(s);

        /* =================================================
           🎯 SERVICES
        ================================================= */
        const SERVICES = [
          {
            icon: "i-edit",
            label: "সালাম ভাইয়ের সাথে লেনদেন",
            route: "entry",
          },
          {
            icon: "i-users",
            label: "বিকাশ ম্যানেজমেন্ট",
            route: "hisab",
          },
          // 👇 add more services here
        ];

        /* =================================================
           RENDER
        ================================================= */
        const grid = $("#servicesGrid");

        grid.innerHTML = SERVICES.map(
          (s, i) => `
    <button class="service" data-idx="${i}">
      <span class="service-ico">
        <svg class="icon"><use href="#${s.icon}"/></svg>
      </span>
      <b>${s.label}</b>
    </button>
  `,
        ).join("");

        /* =================================================
           COUNT
        ================================================= */
        const bnDigits = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
        const toBn = (n) => String(n).replace(/\d/g, (d) => bnDigits[+d]);
        $("#svcCount").textContent = toBn(SERVICES.length) + " টি";

        /* =================================================
           ROUTER
        ================================================= */
        const ROUTES = {
          entry: () => {
            window.location.replace("/Entry");
            toast("এন্ট্রি ম্যানেজার খোলা হচ্ছে…");
          },
          hisab: () => {
            window.location.replace("/Bkash");
            toast("বিকাশ ম্যানেজমেন্ট খোলা হচ্ছে…");
          },
        };

        grid.addEventListener("click", (e) => {
          const btn = e.target.closest(".service");
          if (!btn) return;
          const s = SERVICES[+btn.dataset.idx];
          if (!s) return;
          const go = ROUTES[s.route];
          if (typeof go === "function") go();
          else toast(s.label);
        });

        /* =================================================
           TOPBAR SHADOW ON SCROLL
        ================================================= */
        const topbar = $("#topbar");
        window.addEventListener(
          "scroll",
          () => {
            topbar.classList.toggle("scrolled", window.scrollY > 8);
          },
          { passive: true },
        );

        /* =================================================
           TOAST
        ================================================= */
        function toast(msg) {
          const el = $("#toast");
          el.textContent = msg;
          el.classList.add("show");
          clearTimeout(el._t);
          el._t = setTimeout(() => el.classList.remove("show"), 1800);
        }
      })();
    </script>
  </body>
</html>
